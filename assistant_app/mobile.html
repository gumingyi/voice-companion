<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>语音问答 · 手机伴侣</title>
<style>
:root{color-scheme:light;font-family:system-ui,'Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#34465a;font-size:18px;line-height:1.85;-webkit-font-smoothing:antialiased}header{position:sticky;top:0;z-index:2;background:#ffffffed;padding:20px 20px 14px;border-bottom:1px solid #e2e9ef;backdrop-filter:blur(16px)}h1{font-size:21px;letter-spacing:.5px;font-weight:650;color:#183d47;margin:0 0 7px}.status{display:inline-block;color:#278475;background:#eaf6f0;border-radius:20px;padding:2px 11px;font-size:12px;margin-bottom:10px}.status:before{content:'●';font-size:9px;margin-right:7px}main{max-width:850px;margin:auto;padding:18px 18px 36px}article{background:white;border:1px solid #e2e9ef;border-radius:16px;padding:23px 21px;margin:18px 0;box-shadow:0 3px 15px #223c4a04}h2{font-size:16px;line-height:1.6;font-weight:600;color:#218279;border-bottom:1px solid #eff3f5;padding-bottom:15px;margin:0 0 17px}p{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 19px}article p{margin-bottom:22px}small{color:#97a5b1;font-size:12px}button{font:inherit;font-size:12px;background:#f8fafb;color:#718294;border:1px solid #e1e8ee;border-radius:8px;padding:7px 11px;margin:0;cursor:pointer;min-height:36px}button:active{background:#e8f3ef;color:#187c72}button:focus-visible{outline:2px solid #4d9d93;outline-offset:2px}nav{display:flex;gap:7px;flex-wrap:wrap}nav button:last-child{color:#b1736c}#transcript{font-size:14px;color:#8398a7;padding:0 4px}#transcript:empty{display:none}#notice{font-size:14px;color:#b3814b}#notice:empty{display:none}@media(min-width:600px){header{padding:24px max(24px,calc((100vw - 814px)/2)) 17px}main{padding-top:26px}article{padding:28px 30px}h2{font-size:18px}}
</style><header><h1>声答 · 手机伴侣</h1><div class="status" id="state">连接中…</div><nav><button onclick="location.reload()">刷新</button><button onclick="clearView()">清空本机显示</button><button onclick="resize(1)">字号＋</button><button onclick="resize(-1)">字号－</button><button onclick="unpair()">解除配对</button></nav></header><main><small>仅供经过允许的交流场景使用 · 本页接收文字</small><p id="notice"></p><p id="transcript"></p><section id="answers"></section></main>
<script>
let ws,stopped=false,delay=500,last={history:[]},hidden=new Set(JSON.parse(sessionStorage.getItem('hidden')||'[]')),font=+(localStorage.getItem('font')||18);
function resize(n){font=Math.max(14,Math.min(32,font+n));document.body.style.fontSize=font+'px';localStorage.setItem('font',font)}resize(0);
function clearView(){last.history.forEach(x=>hidden.add(x.id));sessionStorage.setItem('hidden',JSON.stringify([...hidden]));render(last)}
function render(s){last=s;document.getElementById('state').textContent='已连接 · '+s.status;document.getElementById('transcript').textContent=s.transcript||'';let root=document.getElementById('answers');root.replaceChildren();s.history.slice().reverse().filter(x=>!hidden.has(x.id)).forEach(x=>{let a=document.createElement('article'),q=document.createElement('h2'),p=document.createElement('p'),m=document.createElement('small');q.textContent=x.question;p.textContent=x.answer||'等待生成…';m.textContent=(x.model||'')+' · '+({done:'已完成',generating:'生成中',cancelled:'已取消',error:'生成失败'}[x.status]||x.status);a.append(q,p,m);root.append(a)})}
async function unpair(){stopped=true;if(ws)ws.close();await fetch('/unpair',{method:'POST'});document.getElementById('state').textContent='已解除配对';document.getElementById('answers').replaceChildren();document.getElementById('transcript').textContent='';}
function connect(){if(stopped)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');let opened=false;ws.onopen=()=>{opened=true;delay=500;document.getElementById('notice').textContent=''};ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=e=>{if(stopped)return;if(e.code===1008){stopped=true;document.getElementById('state').textContent='配对已失效';return}document.getElementById('state').textContent='连接断开，正在重连…';document.getElementById('notice').textContent='若首次访问，请用电脑生成的配对二维码打开；确认手机和电脑在同一可信 Wi-Fi。';setTimeout(connect,delay);delay=Math.min(10000,delay*2)};ws.onerror=()=>ws.close()}
(async()=>{let token=new URLSearchParams(location.hash.slice(1)).get('pair');history.replaceState(null,'',location.pathname);if(token){try{let r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok){let d=await r.json();document.getElementById('state').textContent=d.error;return}}catch{document.getElementById('state').textContent='配对失败，请检查局域网连接';return}}connect()})();
</script></html>
